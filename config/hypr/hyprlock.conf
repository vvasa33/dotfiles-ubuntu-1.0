# Hyprlock — Linux Ocean (matches waybar / wofi)
# Tokens: #f8fdff #00334d #24a9e8 #0075bc #b8e6f7

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

animations {
    enabled = true
}

# Opaque wallpaper fills the whole screen. No screenshot, no blur.
background {
    monitor =
    path = ~/Pictures/wallpaper.png
    color = rgb(248, 253, 255)
    blur_passes = 0
    zindex = -1
}

# Hard-offset shadow behind the lock card
shape {
    monitor =
    size = 460, 300
    color = rgb(0, 51, 77)
    rounding = 0
    border_size = 0
    position = 8, -8
    halign = center
    valign = center
    zindex = 0
}

# Lock card
shape {
    monitor =
    size = 460, 300
    color = rgb(248, 253, 255)
    rounding = 0
    border_size = 4
    border_color = rgb(0, 51, 77)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Time — 12-hour, same as waybar
label {
    monitor =
    text = $TIME12
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    color = rgb(0, 51, 77)
    position = 0, 70
    halign = center
    valign = center
    zindex = 2
}

# Date
label {
    monitor =
    text = cmd[update:1000] date '+%A, %B %d'
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgb(0, 51, 77)
    position = 0, 28
    halign = center
    valign = center
    zindex = 2
}

# Input field shadow
shape {
    monitor =
    size = 320, 48
    color = rgb(0, 51, 77)
    rounding = 0
    position = 5, -67
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 4
    rounding = 0

    outer_color = rgb(0, 51, 77)
    inner_color = rgb(184, 230, 247)
    font_color = rgb(0, 51, 77)
    font_family = JetBrainsMono Nerd Font

    check_color = rgb(36, 169, 232)
    fail_color = rgb(0, 51, 77)
    capslock_color = rgb(36, 169, 232)

    fade_on_empty = false
    placeholder_text = PASSWORD
    fail_text = FAIL  $ATTEMPTS
    swap_font_color = false

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 0

    position = 0, -62
    halign = center
    valign = center
    zindex = 3
}
