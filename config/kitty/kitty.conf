# Kitty — Linux Ocean (light, matches waybar / wofi)
# Tokens: #f8fdff #00334d #24a9e8 #0075bc #b8e6f7

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        13.0
adjust_line_height  2

# ── Window ────────────────────────────────────────────────────────────────────
foreground              #00334d
background              #f8fdff
background_opacity      1.0
dynamic_background_opacity no
window_padding_width    12
window_margin_width     0
window_border_width     0
hide_window_decorations titlebar-only

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor                  #00334d
cursor_text_color       #f8fdff
cursor_shape            block
cursor_beam_thickness   2
cursor_blink_interval   0

# ── Selection ─────────────────────────────────────────────────────────────────
selection_foreground    #00334d
selection_background    #b8e6f7

# ── Links ─────────────────────────────────────────────────────────────────────
url_color               #0075bc
url_style               curly

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           separator
tab_separator           " ┃ "
tab_bar_min_tabs        1
tab_bar_background      #b8e6f7
active_tab_background   #00334d
active_tab_foreground   #f8fdff
inactive_tab_background #f8fdff
inactive_tab_foreground #00334d
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template      "{index}: {title.split('/')[-1]}"

# ── Colors (16) ───────────────────────────────────────────────────────────────
color0   #00334d
color1   #c62828
color2   #2e7d52
color3   #b86e00
color4   #0075bc
color5   #5c4d8a
color6   #24a9e8
color7   #4a7085

color8   #6a8fa3
color9   #e53935
color10  #43a047
color11  #f9a825
color12  #24a9e8
color13  #8e6bc4
color14  #5ecfff
color15  #002030

# ── Behavior ──────────────────────────────────────────────────────────────────
scrollback_lines        10000
wheel_scroll_multiplier 3
enable_audio_bell       no
visual_bell_duration    0.0
confirm_os_window_close 0
shell_integration       enabled
repaint_delay           10
input_delay             3
sync_to_monitor         yes

# ── Hyprland / Wayland ────────────────────────────────────────────────────────
wayland_titlebar_color  #f8fdff
