# Wallpaper fills each monitor (cover). Image is 3200x2000 (16:10);
# Odyssey G5 is 2560x1440 (16:9) — contain left gaps on the big display.

preload = ~/Pictures/wallpaper.png

wallpaper {
    monitor = eDP-1
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

wallpaper {
    monitor = DP-5
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

# Fallback for any other / hotplugged output
wallpaper {
    monitor =
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}
